<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8ef">
<title>2048</title>
<style>
  :root{
    --bg:#faf8ef; --text:#776e65; --grid:#bbada0; --empty:#cdc1b4;
    --btn:#8f7a66; --btn-text:#f9f6f2;
    --c2:#eee4da; --c4:#ede0c8; --c8:#f2b179; --c16:#f59563;
    --c32:#f67c5f; --c64:#f65e3b; --c128:#edcf72; --c256:#edcc61;
    --c512:#edc850; --c1024:#edc53f; --c2048:#edc22e; --cbig:#3c3a32;
    --gap:min(2.4vw,12px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Clear Sans","Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); gap:14px;
    min-height:100vh; min-height:100dvh; touch-action:none; user-select:none;
  }
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:clamp(40px,13vw,58px);font-weight:800;line-height:.9}
  .scores{display:flex;gap:8px}
  .score-box{
    background:var(--grid);border-radius:6px;color:#eee4da;
    padding:7px 14px;text-align:center;min-width:74px;position:relative;
  }
  .score-box .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#eee4da;opacity:.9}
  .score-box .val{font-size:20px;font-weight:800;color:#fff}
  .add{
    position:absolute;left:0;right:0;top:4px;color:#776e65;font-weight:800;font-size:18px;
    opacity:0;pointer-events:none;animation:floatUp .7s ease;
  }
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar p{font-size:14px;line-height:1.35}
  .bar p b{color:#5c554e}
  .btns{display:flex;gap:8px}
  button{
    background:var(--btn);color:var(--btn-text);border:none;border-radius:6px;
    font-family:inherit;font-weight:700;font-size:14px;padding:10px 14px;cursor:pointer;
  }
  button:active{transform:scale(.96)}
  button.ghost{background:transparent;color:var(--btn);border:2px solid var(--btn);padding:8px 12px}
  .board-wrap{position:relative;width:100%}
  .board{
    position:relative;background:var(--grid);border-radius:10px;
    padding:var(--gap);width:100%;aspect-ratio:1;touch-action:none;
  }
  .cell-bg{position:absolute;background:var(--empty);border-radius:6px;z-index:1}
  .tile{
    position:absolute;border-radius:6px;display:flex;align-items:center;justify-content:center;z-index:2;
    font-weight:800;background:var(--c2);color:var(--text);
    transition:left .11s ease,top .11s ease;will-change:transform;
  }
  .tile .inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;animation:pop .14s ease}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .tile.merged .inner{animation:merge .16s ease}
  @keyframes merge{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
  .t2{background:var(--c2)} .t4{background:var(--c4)}
  .t8{background:var(--c8);color:#f9f6f2} .t16{background:var(--c16);color:#f9f6f2}
  .t32{background:var(--c32);color:#f9f6f2} .t64{background:var(--c64);color:#f9f6f2}
  .t128{background:var(--c128);color:#f9f6f2} .t256{background:var(--c256);color:#f9f6f2}
  .t512{background:var(--c512);color:#f9f6f2} .t1024{background:var(--c1024);color:#f9f6f2}
  .t2048{background:var(--c2048);color:#f9f6f2} .tbig{background:var(--cbig);color:#f9f6f2}
  .overlay{
    position:absolute;inset:0;border-radius:10px;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:rgba(238,228,218,.73);z-index:10;text-align:center;
  }
  .overlay.show{display:flex}
  .overlay.win{background:rgba(237,194,46,.5)}
  .overlay h2{font-size:clamp(34px,10vw,46px);font-weight:800}
  footer{font-size:12px;opacity:.6;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="lbl">Pontos</div><div class="val" id="score">0</div><div class="add" id="scoreAdd"></div></div>
      <div class="score-box"><div class="lbl">Recorde</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div class="bar">
    <p>Junte os números até chegar no <b>2048!</b></p>
    <div class="btns">
      <button class="ghost" id="undo" title="Desfazer">↶</button>
      <button id="newgame">Novo jogo</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovMsg"></h2>
      <div class="btns">
        <button id="keepgoing" style="display:none">Continuar</button>
        <button id="retry">Tentar de novo</button>
      </div>
    </div>
  </div>

  <footer>Setas / WASD no teclado &nbsp;•&nbsp; Deslize o dedo no celular</footer>
</div>

<script>
(function(){
  const N = 4;
  const board = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const ovMsg = document.getElementById('ovMsg');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const scoreAddEl = document.getElementById('scoreAdd');

  let grid, score, best, won, over, uid, prevState, animating=false;

  best = parseInt(localStorage.getItem('g2048_best')||'0',10);
  bestEl.textContent = best;

  function emptyGrid(){ return Array.from({length:N},()=>Array(N).fill(null)); }

  function newGame(){
    grid = emptyGrid();
    score = 0; won = false; over = false; uid = 1; prevState = null;
    addRandom(); addRandom();
    updateScore(0);
    hideOverlay();
    render(true);
    save();
  }

  function addRandom(){
    const cells = [];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])cells.push([r,c]);
    if(!cells.length) return;
    const [r,c] = cells[Math.floor(Math.random()*cells.length)];
    grid[r][c] = {value: Math.random()<0.9?2:4, id: uid++, isNew:true};
  }

  function snapshot(){
    return {
      grid: grid.map(row=>row.map(t=>t?{value:t.value,id:t.id}:null)),
      score, won, over, uid
    };
  }
  function restore(s){
    grid = s.grid.map(row=>row.map(t=>t?{value:t.value,id:t.id}:null));
    score = s.score; won = s.won; over = s.over; uid = s.uid;
  }

  // direction: 0=left,1=right,2=up,3=down
  function move(dir){
    if(animating || over) return;
    const before = snapshot();
    let moved = false, gained = 0;

    const lines = [];
    for(let i=0;i<N;i++){
      const line = [];
      for(let j=0;j<N;j++){
        let r,c;
        if(dir===0){r=i;c=j} else if(dir===1){r=i;c=N-1-j}
        else if(dir===2){r=j;c=i} else {r=N-1-j;c=i}
        line.push([r,c]);
      }
      lines.push(line);
    }

    for(const line of lines){
      const tiles = line.map(([r,c])=>grid[r][c]).filter(Boolean);
      const merged = [];
      for(let k=0;k<tiles.length;k++){
        if(k+1<tiles.length && tiles[k].value===tiles[k+1].value){
          const val = tiles[k].value*2;
          merged.push({value:val, id:tiles[k].id, mergedFrom:tiles[k+1].id, justMerged:true});
          gained += val;
          if(val===2048) won = true;
          k++;
        } else {
          merged.push({value:tiles[k].value, id:tiles[k].id});
        }
      }
      // write back
      for(let j=0;j<N;j++){
        const [r,c] = line[j];
        const t = merged[j] || null;
        if(t){
          if(!grid[r][c] || grid[r][c].id!==t.id || grid[r][c].value!==t.value) moved = true;
        } else if(grid[r][c]){ moved = true; }
        grid[r][c] = t;
      }
    }

    if(!moved){ return; }
    prevState = before;
    if(gained>0) updateScore(gained);
    addRandom();
    render();
    save();

    if(!won && !canMove()){
      over = true;
      setTimeout(()=>showOverlay('Fim de jogo!', false), 180);
    }
    if(won && !over){
      over = true;
      setTimeout(()=>showOverlay('Você venceu! 🎉', true), 180);
    }
  }

  function canMove(){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(!grid[r][c]) return true;
      const v = grid[r][c].value;
      if(c+1<N && grid[r][c+1] && grid[r][c+1].value===v) return true;
      if(r+1<N && grid[r+1][c] && grid[r+1][c].value===v) return true;
    }
    return false;
  }

  function undo(){
    if(!prevState || animating) return;
    restore(prevState);
    prevState = null;
    over = false;
    scoreEl.textContent = score;
    hideOverlay();
    render(true);
    save();
  }

  function updateScore(gain){
    score += gain;
    scoreEl.textContent = score;
    if(gain>0){
      scoreAddEl.textContent = '+'+gain;
      scoreAddEl.style.animation='none';
      void scoreAddEl.offsetWidth;
      scoreAddEl.style.animation='';
    }
    if(score>best){
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('g2048_best', best);
    }
  }

  // ----- rendering with absolute positioning -----
  const tileEls = new Map();

  function metrics(){
    const inner = board.clientWidth - 2*gapPx();
    const size = (inner - (N-1)*gapPx())/N;
    return {size, gap:gapPx(), pad:gapPx()};
  }
  function gapPx(){
    return parseFloat(getComputedStyle(board).getPropertyValue('--gap')) || 12;
  }
  function pos(r,c){
    const m = metrics();
    return { left: m.pad + c*(m.size+m.gap), top: m.pad + r*(m.size+m.gap), size:m.size };
  }
  function tileClass(v){
    if(v<=1024) return 't'+v;
    if(v===2048) return 't2048';
    return 'tbig';
  }
  function fontSize(v,size){
    const len = String(v).length;
    let f = size*0.46;
    if(len===3) f = size*0.38;
    else if(len===4) f = size*0.30;
    else if(len>=5) f = size*0.24;
    return f+'px';
  }

  function drawBackground(){
    board.querySelectorAll('.cell-bg').forEach(e=>e.remove());
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const bg = document.createElement('div');
      bg.className='cell-bg';
      const p = pos(r,c);
      bg.style.left=p.left+'px'; bg.style.top=p.top+'px';
      bg.style.width=p.size+'px'; bg.style.height=p.size+'px';
      board.appendChild(bg);
    }
  }

  function render(instant){
    const present = new Set();
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const t = grid[r][c];
      if(!t) continue;
      present.add(t.id);
      const p = pos(r,c);
      let el = tileEls.get(t.id);
      if(!el){
        el = document.createElement('div');
        el.className='tile';
        el.innerHTML='<span class="inner"></span>';
        el.style.left=p.left+'px'; el.style.top=p.top+'px';
        el.style.width=p.size+'px'; el.style.height=p.size+'px';
        board.appendChild(el);
        tileEls.set(t.id, el);
      }
      const inner = el.firstChild;
      inner.textContent = t.value;
      el.className = 'tile '+tileClass(t.value)+(t.justMerged?' merged':'');
      el.style.width=p.size+'px'; el.style.height=p.size+'px';
      el.style.fontSize = fontSize(t.value, p.size);
      if(instant){
        el.style.transition='none';
        el.style.left=p.left+'px'; el.style.top=p.top+'px';
        void el.offsetWidth; el.style.transition='';
      } else {
        el.style.left=p.left+'px'; el.style.top=p.top+'px';
      }
      if(t.justMerged){
        inner.style.animation='none'; void inner.offsetWidth;
        inner.style.animation='merge .16s ease';
        delete t.justMerged;
      }
      if(t.isNew){ delete t.isNew; }
    }
    // remove disappeared tiles
    for(const [id,el] of tileEls){
      if(!present.has(id)){
        el.remove();
        tileEls.delete(id);
      }
    }
  }

  function sizeBoard(){
    // altura explícita = largura (não depende de aspect-ratio, que falta em navegadores antigos)
    const w = board.clientWidth;
    if(w>0) board.style.height = w + 'px';
  }

  function relayout(){
    sizeBoard();
    drawBackground();
    render(true);
  }

  function showOverlay(msg, win){
    ovMsg.textContent = msg;
    overlay.classList.toggle('win', !!win);
    document.getElementById('keepgoing').style.display = win ? '' : 'none';
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  function save(){
    try{
      localStorage.setItem('g2048_state', JSON.stringify({
        grid: grid.map(row=>row.map(t=>t?{value:t.value,id:t.id}:null)),
        score, won, over, uid
      }));
    }catch(e){}
  }
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem('g2048_state'));
      if(s && s.grid && s.grid.length===N){
        restore(s); return true;
      }
    }catch(e){}
    return false;
  }

  // ----- input -----
  const keyMap = {
    ArrowLeft:0, a:0, A:0, ArrowRight:1, d:1, D:1,
    ArrowUp:2, w:2, W:2, ArrowDown:3, s:3, S:3
  };
  window.addEventListener('keydown', e=>{
    if(e.key in keyMap){ e.preventDefault(); move(keyMap[e.key]); }
  });

  let tsx=0, tsy=0, touching=false;
  board.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    touching=true; tsx=e.touches[0].clientX; tsy=e.touches[0].clientY;
  }, {passive:true});
  board.addEventListener('touchend', e=>{
    if(!touching) return; touching=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-tsx, dy=t.clientY-tsy;
    const ax=Math.abs(dx), ay=Math.abs(dy);
    if(Math.max(ax,ay)<24) return;
    if(ax>ay) move(dx>0?1:0); else move(dy>0?3:2);
  }, {passive:true});

  document.getElementById('newgame').addEventListener('click', newGame);
  document.getElementById('retry').addEventListener('click', newGame);
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('keepgoing').addEventListener('click', ()=>{ over=false; hideOverlay(); });

  window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(relayout,80); });

  // boot
  sizeBoard();
  if(load()){
    updateScoreInit();
    relayout();
    if(over) showOverlay(won?'Você venceu! 🎉':'Fim de jogo!', won);
  } else {
    newGame();
  }
  drawBackground();
  render(true);

  function updateScoreInit(){
    scoreEl.textContent = score;
    if(score>best){ best=score; bestEl.textContent=best; localStorage.setItem('g2048_best',best); }
  }
})();
</script>
</body>
</html>
